services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: idrd_pipeline
    ports:
      - "5433:5432"
    volumes:
      - idrd_pgvector_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idrd_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build: .
    working_dir: /app
    command: ["sleep", "infinity"]
    environment: &app_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: idrd_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GROBID_BASE_URL: http://grobid:8070
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      VECTOR_DIMENSIONS: "1536"
      UV_PROJECT_ENVIRONMENT: /opt/idrd-venv
    volumes:
      - .:/app
      - idrd_uv_cache:/root/.cache/uv
      - idrd_venv:/opt/idrd-venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_started

  migrate:
    build: .
    working_dir: /app
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: *app_env
    volumes:
      - .:/app
      - idrd_uv_cache:/root/.cache/uv
      - idrd_venv:/opt/idrd-venv
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    working_dir: /app
    command: ["uv", "run", "celery", "-A", "pipeline.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=solo"]
    environment: *app_env
    volumes:
      - .:/app
      - idrd_uv_cache:/root/.cache/uv
      - idrd_venv:/opt/idrd-venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  idrd_pgvector_data:
  idrd_uv_cache:
  idrd_venv:
